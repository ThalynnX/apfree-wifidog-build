name: build-apfree-wifidog

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd tar curl

      - name: 下载并解压 ImmortalWrt SDK
        run: |
          curl -sL -o sdk.tar.zst "https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx/immortalwrt-sdk-qualcommax-ipq60xx_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          echo "下载字节数: $(stat -c%s sdk.tar.zst)"
          tar --zstd -xf sdk.tar.zst
          ls -d immortalwrt-sdk-*

      - name: 恢复 SDK 构建缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            immortalwrt-sdk-*/staging_dir
            immortalwrt-sdk-*/build_dir
            immortalwrt-sdk-*/dl
          key: sdk-v2-${{ github.sha }}
          restore-keys: sdk-v2-

      - name: SDK 自检（库与包定义）
        run: |
          SDK=$(ls -d immortalwrt-sdk-*)
          cd $SDK
          echo "== staging 库 =="; ls staging_dir/target-aarch64_cortex-a53_musl/usr/lib 2>/dev/null | head -20; echo "库数量: $(ls staging_dir/target-aarch64_cortex-a53_musl/usr/lib 2>/dev/null | wc -l)"
          echo "== staging 头文件 =="; ls staging_dir/target-aarch64_cortex-a53_musl/usr/include 2>/dev/null | head -20
          echo "== 工具链 =="; ls staging_dir/toolchain-aarch64_cortex-a53_gcc-14.4.0_musl/bin 2>/dev/null | head -5
          echo "== package 目录 =="; ls package | head -20

      - name: 放入包定义并拉取 feeds
        run: |
          SDK=$(ls -d immortalwrt-sdk-*)
          cd $SDK
          mkdir -p package/apfree-wifidog
          cp ../pkg/Makefile package/apfree-wifidog/Makefile
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a || true
          echo "== feeds 后的 libs =="; ls package/feeds/packages 2>/dev/null | head -20

      - name: 配置并编译
        run: |
          SDK=$(ls -d immortalwrt-sdk-*)
          cd $SDK
          cat > .config <<'EOF'
          CONFIG_PACKAGE_apfree-wifidog=y
          CONFIG_PACKAGE_libevent2=y
          CONFIG_PACKAGE_libevent2-core=y
          CONFIG_PACKAGE_libevent2-extra=y
          CONFIG_PACKAGE_libevent2-openssl=y
          CONFIG_PACKAGE_libjson-c=y
          CONFIG_PACKAGE_libmosquitto-ssl=y
          CONFIG_PACKAGE_libnetfilter-queue=y
          CONFIG_PACKAGE_libnftnl=y
          CONFIG_PACKAGE_libmnl=y
          CONFIG_PACKAGE_libuci=y
          CONFIG_PACKAGE_libopenssl=y
          CONFIG_PACKAGE_zlib=y
          EOF
          make defconfig
          set -o pipefail
          make -j$(nproc) package/apfree-wifidog/compile V=s 2>&1 | tee /tmp/build.log

      - name: 保存 SDK 构建缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            immortalwrt-sdk-*/staging_dir
            immortalwrt-sdk-*/build_dir
            immortalwrt-sdk-*/dl
          key: sdk-v2-${{ github.sha }}

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apfree-wifidog-aarch64_cortex-a53
          path: |
            immortalwrt-sdk-*/bin/packages/**/*.apk
            immortalwrt-sdk-*/bin/packages/**/*.ipk
          if-no-files-found: warn

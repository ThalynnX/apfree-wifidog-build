name: build-apfree-wifidog

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libncurses-dev gawk git zstd rsync unzip bzip2

      - name: 拉取 ImmortalWrt 源码与 feeds
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git owrt
          cd owrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 放入 apfree-wifidog 包定义
        run: |
          mkdir -p owrt/package/local/apfree-wifidog
          cp pkg/Makefile owrt/package/local/apfree-wifidog/Makefile

      - name: 配置目标（只选 target/subtarget，不选设备，避免拉入内核模块）
        run: |
          cd owrt
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_PACKAGE_apfree-wifidog=y
          CONFIG_ALL=n
          # CONFIG_PACKAGE_gpio-button-hotplug is not set
          # CONFIG_PACKAGE_kmod-button-hotplug is not set
          # CONFIG_PACKAGE_kmod-gpio-button-hotplug is not set
          EOF
          make defconfig

      - name: 恢复工具链缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            owrt/staging_dir
            owrt/build_dir/host
            owrt/build_dir/hostpkg
            owrt/build_dir/toolchain-aarch64_cortex-a53_gcc-14.4.0_musl
          key: chain-v3-${{ github.sha }}
          restore-keys: chain-v3-

      - name: 构建宿主机工具链
        run: |
          cd owrt
          set -o pipefail
          make -j$(nproc) tools/compile V=s 2>&1 | tail -n 200

      - name: 构建目标交叉工具链
        run: |
          cd owrt
          set -o pipefail
          make -j$(nproc) toolchain/compile V=s 2>&1 | tail -n 200

      - name: 保存工具链缓存（失败也保存）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            owrt/staging_dir
            owrt/build_dir/host
            owrt/build_dir/hostpkg
            owrt/build_dir/toolchain-aarch64_cortex-a53_gcc-14.4.0_musl
          key: chain-v3-${{ github.sha }}

      - name: 编译
        run: |
          cd owrt
          set -o pipefail
          make -j$(nproc) package/apfree-wifidog/compile V=s 2>&1 | tee /tmp/build.log

      - name: 上传构建日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apfree-wifidog-aarch64_cortex-a53
          path: |
            owrt/bin/packages/**/*.apk
            owrt/bin/packages/**/*.ipk
          if-no-files-found: warn
